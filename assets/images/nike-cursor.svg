<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" fill="none">
  <defs>
    <!-- Crisp drop shadow for depth -->
    <filter id="sneakerShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <g filter="url(#sneakerShadow)">
    <!-- Angled Sneaker: Rotated -35 deg so toe points to top-left (3, 3) -->
    <g transform="translate(18, 20) rotate(-36) translate(-20, -14)">
      <!-- Outer White Silhouette Border (Ensures visibility on black AND white backgrounds) -->
      <path d="M 4 14 C 3 14 2 16 3 18 L 4 19.5 C 5 21 7 21 9 21 L 34 21 C 37 21 39 19 39 17 L 39 15 C 39 11 36 7 33 7 C 31 7 28 8 26 6.5 C 24 5 21 3 18 3 C 16 3 14 5 13 7 L 8 10 C 6 11 4 12.5 4 14 Z" 
            fill="#ffffff" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round" />

      <!-- Sneaker Outsole (Dark Ash Tread) -->
      <path d="M 4 18.5 C 4 19.5 5.5 20.5 8 20.5 L 34 20.5 C 36.5 20.5 38 19.5 38 18 L 38 16.5 L 4 16.5 Z" 
            fill="#18181b" />

      <!-- Sneaker Midsole (Pure White with texture) -->
      <path d="M 3.8 14.8 L 3.8 17.5 L 38 17.5 L 38 14.8 C 38 14.8 35 14.2 30 14.2 L 9 14.2 C 5 14.2 3.8 14.8 3.8 14.8 Z" 
            fill="#ffffff" stroke="#e4e4e7" stroke-width="0.5" />
      <!-- Midsole stitch groove line -->
      <line x1="5" y1="16" x2="36" y2="16" stroke="#d4d4d8" stroke-width="0.6" stroke-dasharray="1.2 0.8" />

      <!-- Sneaker Main Upper Body (Ash Charcoal #27272a) -->
      <path d="M 4.5 14 C 4.5 12.8 6.5 11 8.5 10.2 L 13.5 7.5 C 14.5 5.8 16.5 4 18.5 4 C 20.5 4 23 5.5 25 7 C 27 8.2 30 7.5 32.5 7.5 C 35.5 7.5 37.5 10.5 37.5 14.2 L 4.5 14.2 Z" 
            fill="#27272a" />

      <!-- Toe Box Panel (Crisp White Leather) -->
      <path d="M 5 13.8 C 5 12.5 7 11 9 10.5 L 12 11.5 C 10.5 12.5 7 13.5 5 13.8 Z" 
            fill="#ffffff" />
      <!-- Toe Box perforations/dots -->
      <circle cx="7.5" cy="12" r="0.4" fill="#a1a1aa" />
      <circle cx="9" cy="11.5" r="0.4" fill="#a1a1aa" />

      <!-- Tongue & Collar (Medium Ash #71717a) -->
      <path d="M 14 7.2 L 18 3.8 C 19.5 3.8 21 5 22 6 L 18 7.5 Z" 
            fill="#52525b" />
      <!-- Heel collar padding -->
      <path d="M 27 7.5 C 29 8.5 31 8 33 8 C 34.5 8 36 9.5 36.5 12 L 34 12 C 32 10 29 9 27 7.5 Z" 
            fill="#e4e4e7" />

      <!-- Laces (White criss-cross lines) -->
      <line x1="12" y1="9.5" x2="15" y2="7.5" stroke="#ffffff" stroke-width="0.9" stroke-linecap="round" />
      <line x1="14" y1="8" x2="17" y2="6.2" stroke="#ffffff" stroke-width="0.9" stroke-linecap="round" />
      <line x1="16" y1="6.8" x2="19" y2="5.2" stroke="#ffffff" stroke-width="0.9" stroke-linecap="round" />

      <!-- Heel Overlay / Counter (Dark Ash #18181b) -->
      <path d="M 31 8 C 33 8 36 10 36.5 14 L 30 14 C 29 11 29 9 31 8 Z" 
            fill="#18181b" />

      <!-- BOLD NIKE SWOOSH (Pure White with Crisp Ash Border) -->
      <path d="M 12 11.8 C 16 12.8 20 14.5 25 14.5 C 28.5 14.5 32 13.5 36 10 C 33 12 29 12.8 25 12.5 C 21 12.2 17 11 13 9.8 C 12 9.5 11.5 10.5 12 11.8 Z" 
            fill="#ffffff" stroke="#09090b" stroke-width="0.5" />
    </g>

    <!-- Precise Click Hotspot Indicator at (3, 3) -->
    <!-- Subtle target dot matching the toe tip -->
    <circle cx="3.5" cy="3.5" r="2.2" fill="#ffffff" stroke="#18181b" stroke-width="0.8" />
    <circle cx="3.5" cy="3.5" r="1.1" fill="#18181b" />
  </g>
</svg>
